name: subscription-meter
services:
  postgres:
    image: postgres:18
    profiles: [legacy]
    restart: unless-stopped
    environment:
      POSTGRES_USER: meter
      POSTGRES_DB: meter
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/bootstrap.py first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U meter -d meter"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
  timescaledb:
    image: timescale/timescaledb:latest-pg18@sha256:0fcff5761363809d1242f2261a3482197b5a5337407f8b97a976fb174206d579
    restart: unless-stopped
    environment:
      POSTGRES_USER: meter
      POSTGRES_DB: meter
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/bootstrap.py first}
      TIMESCALEDB_TELEMETRY: "off"
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
      TS_TUNE_MAX_CONNS: "50"
    volumes:
      - timescale-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U meter -d meter"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://timescaledb:5432/meter
      DATABASE_USER: meter
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      UPSTREAM_MODE: ${UPSTREAM_MODE:-mock}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://mock:8081}
      UPSTREAM_TOKEN_FILE: /run/secrets/upstream-token
      ADMIN_TOKEN_FILE: /run/secrets/admin-token
      METRICS_TOKEN_FILE: /run/secrets/metrics-token
      TIMESCALE_ENABLED: "true"
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      AUDIT_METADATA_RETENTION_DAYS: ${AUDIT_METADATA_RETENTION_DAYS:-90}
      AUDIT_MAX_RESPONSE_BYTES: ${AUDIT_MAX_RESPONSE_BYTES:-8388608}
      AUDIT_MAX_EVENTS: ${AUDIT_MAX_EVENTS:-10000}
    secrets: [admin-token, metrics-token, upstream-token]
    ports: ["127.0.0.1:8180:8180"]
    depends_on:
      timescaledb: {condition: service_healthy}
    mem_limit: 1g
    stop_grace_period: 40s
  mock:
    image: python:3.13-slim
    restart: unless-stopped
    command: [python, /mock.py]
    volumes: ["./scripts/mock_upstream.py:/mock.py:ro"]
    read_only: true
    user: "10001:10001"
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets: [metrics-token]
    ports: ["127.0.0.1:9190:9090"]
    mem_limit: 512m
  public-edge:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: [public]
    restart: unless-stopped
    ports: ["127.0.0.1:8182:8182"]
    volumes:
      - ./deploy/public-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs: [/config, /data]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    depends_on:
      app: {condition: service_started}
volumes:
  postgres-data:
  timescale-data:
  prometheus-data:
secrets:
  admin-token: {file: ./secrets/admin-token}
  metrics-token: {file: ./secrets/metrics-token}
  upstream-token: {file: ./secrets/upstream-token}
