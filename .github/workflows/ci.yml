name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: npm ci --prefix mcp --ignore-scripts && npm test --prefix mcp
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Start isolated PostgreSQL for accounting regressions
        run: docker compose -p control-usage-test -f compose.audit-test.yaml up -d --wait --wait-timeout 60 postgres
      - name: Verify PostgreSQL accounting query and reconciliation
        env:
          AUDIT_INTEGRATION: 'true'
        run: mvn --batch-mode --no-transfer-progress -Dtest=AccountingPostgresTest,RequestSearchPostgresTest test
      - name: Remove isolated PostgreSQL
        if: always()
        run: docker compose -p control-usage-test -f compose.audit-test.yaml down -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race deploy/coder-cd/main.go deploy/coder-cd/main_test.go
      - run: bash -n scripts/receive_release.sh
      - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t control-usage:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/tests/windows_setup_ci.ps1
