name: Release control-usage
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after the compatibility/bootstrap checklist is verified'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: control-usage-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: node --test src/test/js/*.test.cjs
      - run: bash -n scripts/receive_release.sh
      - name: Start isolated audit dependencies
        run: docker compose -p control-usage-test -f compose.audit-test.yaml up -d --wait --wait-timeout 120
      - name: Verify replay, safety and concurrent streaming
        env:
          AUDIT_INTEGRATION: 'true'
        run: mvn --batch-mode --no-transfer-progress -Dtest=AuditKafkaIntegrationTest,KafkaSafetyIntegrationTest,AuditStreamLoadTest test
      - run: python3 scripts/tests/packaged_smoke.py
      - name: Verify PostgreSQL coordination and pinned edge reload
        run: python3 scripts/tests/isolated_deployment.py
      - name: Remove isolated audit dependencies
        if: always()
        run: docker compose -p control-usage-test -f compose.audit-test.yaml down -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vimalkryadav/control-usage:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.control-usage.audit-contract=1
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/vimalkryadav/control-usage@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: coder/setup-action@v1
        with:
          access_url: https://coder.scaler.com
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}
      - name: Deploy immutable release to the dedicated checkout
        env:
          RELEASE_IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_IMAGE" =~ ^ghcr.io/vimalkryadav/control-usage@sha256:[0-9a-f]{64}$ ]]
          coder ssh --disable-autostart --wait=no bugpolice-control -- /home/coder/control-usage-deploy/scripts/receive_release.sh "$RELEASE_SHA" "$RELEASE_IMAGE"
