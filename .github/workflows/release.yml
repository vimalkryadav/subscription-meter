name: Release control-usage
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy this main release after successful verification'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: control-usage-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: npm ci --prefix mcp --ignore-scripts && npm test --prefix mcp
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race deploy/coder-cd/main.go deploy/coder-cd/main_test.go
      - run: bash -n scripts/receive_release.sh
      - name: Start isolated audit dependencies
        run: docker compose -p control-usage-test -f compose.audit-test.yaml up -d --wait --wait-timeout 120
      - name: Verify replay, safety and concurrent streaming
        env:
          AUDIT_INTEGRATION: 'true'
        run: mvn --batch-mode --no-transfer-progress -Dtest=AuditKafkaIntegrationTest,KafkaSafetyIntegrationTest,AuditStreamLoadTest,KafkaApplicationContextIntegrationTest,AccountingPostgresTest,RequestSearchPostgresTest test
      - run: python3 scripts/tests/packaged_smoke.py
      - name: Verify PostgreSQL coordination and pinned edge reload
        run: python3 scripts/tests/isolated_deployment.py
      - name: Remove isolated audit dependencies
        if: always()
        run: docker compose -p control-usage-test -f compose.audit-test.yaml down -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vimalkryadav/control-usage:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.control-usage.audit-contract=1
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/vimalkryadav/control-usage@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Download the deployment-matched Coder CLI
        run: |
          server_version=$(curl --fail --silent --show-error --retry 3 --max-time 30 https://coder.scaler.com/api/v2/buildinfo | jq -er '.version')
          [[ "$server_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]
          curl --fail --silent --show-error --location --retry 3 --max-time 120 https://coder.scaler.com/bin/coder-linux-amd64 -o "$RUNNER_TEMP/coder"
          chmod 700 "$RUNNER_TEMP/coder"
          cli_version=$("$RUNNER_TEMP/coder" version | awk 'NR == 1 { value=$2 } END { print value }')
          [[ "$cli_version" == "$server_version" ]]
          current_version=$(curl --fail --silent --show-error --retry 3 --max-time 30 https://coder.scaler.com/api/v2/buildinfo | jq -er '.version')
          [[ "$current_version" == "$server_version" ]]
      - name: Deploy immutable release to the dedicated checkout
        env:
          RELEASE_IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_SHA: ${{ github.sha }}
          AUTOMATION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
        run: |
          umask 077
          token_file=$(mktemp "$RUNNER_TEMP/control-usage-token.XXXXXX")
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$AUTOMATION_TOKEN" > "$token_file"
          unset AUTOMATION_TOKEN
          go run deploy/coder-cd/main.go --coder "$RUNNER_TEMP/coder" --token-file "$token_file" --sha "$RELEASE_SHA" --image "$RELEASE_IMAGE"
