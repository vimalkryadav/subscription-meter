# Isolated integration dependencies; never attach to production networks or volumes.
services:
  kafka:
    image: apache/kafka:4.2.0
    ports: ["127.0.0.1:29092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: [CMD-SHELL, "bash -c 'true > /dev/tcp/127.0.0.1/9092'"]
      interval: 2s
      timeout: 2s
      retries: 45
    mem_limit: 1g
  postgres:
    image: postgres:18-alpine
    ports: ["127.0.0.1:25432:5432"]
    environment:
      POSTGRES_DB: audit_test
      POSTGRES_USER: audit_test
      POSTGRES_PASSWORD: local-integration-only
    healthcheck:
      test: [CMD, pg_isready, -U, audit_test, -d, audit_test]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m
