spring.application.name=subscription-meter
spring.threads.virtual.enabled=true
server.port=${PORT:8180}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/meter}
spring.datasource.username=${DATABASE_USER:meter}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
meter.mode=${UPSTREAM_MODE:mock}
meter.upstream-url=${UPSTREAM_URL:http://mock:8081}
meter.upstream-token-file=${UPSTREAM_TOKEN_FILE:secrets/upstream-token}
meter.admin-token-file=${ADMIN_TOKEN_FILE:secrets/admin-token}
meter.metrics-token-file=${METRICS_TOKEN_FILE:secrets/metrics-token}
meter.timeout-seconds=${UPSTREAM_TIMEOUT_SECONDS:300}
